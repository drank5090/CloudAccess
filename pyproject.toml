[project]
name = "cloudaccess"
version = "0.1.2"
description = "CloudAccess - 一键管理多云厂商服务器防火墙放通 / One-click firewall access for multi-cloud servers"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "drank5090" }]
requires-python = ">=3.11"
keywords = ["cloud", "firewall", "aliyun", "tencent-cloud", "huawei-cloud", "security-group", "pyside6"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: System Administrators",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking :: Firewalls",
]
dependencies = [
    "pyside6>=6.8",
    "keyring>=25",
    "requests>=2.32",
    "platformdirs>=4",
    "alibabacloud-ecs20140526>=7.0.0",
    "alibabacloud-swas-open20200601>=2.0.0",
    "alibabacloud-tea-openapi>=0.3.10",
    "tencentcloud-sdk-python-cvm>=3.0.1300",
    "tencentcloud-sdk-python-lighthouse>=3.0.1300",
    "huaweicloudsdkcore>=3.1.140",
    "huaweicloudsdkiam>=3.1.140",
    "huaweicloudsdkecs>=3.1.140",
    "huaweicloudsdkvpc>=3.1.140",
    "tencentcloud-sdk-python-vpc>=3.0.1300",
    # huaweicloudsdkcore 实际依赖 six（six.moves）但未声明
    "six>=1.16",
]

[project.urls]
Homepage = "https://github.com/drank5090/CloudAccess"
Repository = "https://github.com/drank5090/CloudAccess"
Changelog = "https://github.com/drank5090/CloudAccess/blob/main/CHANGELOG.md"

[project.scripts]
cloudaccess = "cloudaccess.app:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "pyinstaller>=6.11",
    "pillow>=11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloudaccess"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]
